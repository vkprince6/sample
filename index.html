<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Timer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(45deg, #2b5876, #4e4376);
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      width: 340px;
    }

    .timer-circle {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto;
    }

    .timer-circle svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .timer-circle svg circle {
      width: 100%;
      height: 100%;
      fill: none;
      stroke-width: 10;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-linecap: round;
    }

    .timer-circle svg circle.progress {
      stroke: #64dfdf;
      stroke-dasharray: 752;
      stroke-dashoffset: 752;
      transition: stroke-dashoffset 1s linear;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      min-width: 100px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .input-group {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 10px;
    }

    .time-input {
      width: 60px;
      padding: 8px;
      border-radius: 5px;
      border: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .time-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    h1 {
      margin-top: 0;
      font-weight: 300;
    }

    .pulse {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: translateX(-5px);
      }
      20%, 40%, 60%, 80% {
        transform: translateX(5px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><b>Problem Solver</b></h1>

    <div class="timer-circle">
      <svg>
        <circle cx="125" cy="125" r="120"></circle>
        <circle cx="125" cy="125" r="120" class="progress"></circle>
      </svg>
      <div class="timer-display">00:00</div>
    </div>

    <div class="input-group">
      <input type="number" placeholder="Min" class="time-input" id="minutes" min="0" max="59">
      <input type="number" placeholder="Sec" class="time-input" id="seconds" min="0" max="59">
    </div>

    <div class="controls">
      <button class="btn" id="start">Start</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const minutesInput = document.getElementById('minutes');
      const secondsInput = document.getElementById('seconds');
      const startBtn = document.getElementById('start');
      const resetBtn = document.getElementById('reset');
      const timerDisplay = document.querySelector('.timer-display');
      const progressCircle = document.querySelector('.progress');

      let interval;
      let totalSeconds = 0;
      let initialTotalSeconds = 0;
      let isRunning = false;

      const beepSound = new Audio('./data/alarm.wav'); // Replace with your audio path

      const circumference = 2 * Math.PI * 120;
      progressCircle.style.strokeDasharray = circumference;
      progressCircle.style.strokeDashoffset = circumference;

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      function updateTimer() {
        if (totalSeconds <= 0) {
          clearInterval(interval);
          timerDisplay.textContent = '00:00';
          progressCircle.style.strokeDashoffset = circumference;
          timerDisplay.classList.add('pulse');
          document.querySelector('.container').classList.add('shake');
          beepSound.play();
          isRunning = false;
          startBtn.textContent = 'Start';
          setTimeout(() => {
            timerDisplay.classList.remove('pulse');
            document.querySelector('.container').classList.remove('shake');
          }, 3000);
          return;
        }

        totalSeconds--;
        timerDisplay.textContent = formatTime(totalSeconds);
        const progress = (initialTotalSeconds - totalSeconds) / initialTotalSeconds;
        const offset = circumference - (progress * circumference);
        progressCircle.style.strokeDashoffset = offset;
      }

      startBtn.addEventListener('click', function () {
        if (isRunning) {
          clearInterval(interval);
          isRunning = false;
          startBtn.textContent = 'Resume';
        } else {
          if (totalSeconds === 0) {
            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;
            totalSeconds = (minutes * 60) + seconds;

            if (totalSeconds <= 0) {
              alert('Please enter a valid time!');
              return;
            }

            initialTotalSeconds = totalSeconds;
          }

          interval = setInterval(updateTimer, 1000);
          isRunning = true;
          startBtn.textContent = 'Pause';
        }
      });

      resetBtn.addEventListener('click', function () {
        clearInterval(interval);
        totalSeconds = 0;
        timerDisplay.textContent = '00:00';
        progressCircle.style.strokeDashoffset = circumference;
        isRunning = false;
        startBtn.textContent = 'Start';
        minutesInput.value = '';
        secondsInput.value = '';
        timerDisplay.classList.remove('pulse');
      });
    });
  </script>
</body>
</html>
